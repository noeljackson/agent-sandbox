name: Go CI

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          args: --config=dev/tools/.golangci.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # E2E packages require a Kind cluster and bin/KUBECONFIG; that proof runs
      # in the dedicated e2e workflow rather than this unit-only job.
      - run: |
          mapfile -t packages < <(
            go list ./... | grep -vE '^sigs\.k8s\.io/agent-sandbox/test/e2e(/extensions)?$'
          )
          go test "${packages[@]}" -count=1
